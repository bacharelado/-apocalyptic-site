name: Qualidade do site

on:
  pull_request:
    branches:
      - fix/ap-003-contatos-comerciais
      - feat/site-institucional-v1
    paths:
      - '**/*.html'
      - 'css/**'
      - 'js/**'
      - 'assets/**'
      - 'tests/**'
      - 'tools/**'
      - 'package*.json'
      - '_headers'
      - 'robots.txt'
      - 'sitemap.xml'
      - '.github/workflows/quality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm test
